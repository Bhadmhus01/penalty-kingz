services:
  - type: web
    name: naija-penalty-kingz
    runtime: node
    plan: starter
    disk:
      name: penalty-kingz-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VATAR_WEBHOOK_SECRET
        sync: false
      - key: VATAR_RESULTS_SECRET
        sync: false
      - key: PLAYER_SESSION_SECRET
        generateValue: true
      - key: VATAR_API_URL
        sync: false
      - key: VATAR_SERVER_TOKEN
        sync: false
      - key: SUPER_EAGLES_MATCH_DATES
        value: ""
      - key: MATCHDAY_EVENT_TITLE
        value: Super Eagles Matchday Challenge
